<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高保真转换器</title>
  <style>
    /* … 样式保持不变 … */
  </style>
</head>
<body>
  <!-- … 页面结构保持不变 … -->
  <script>
    (function() {
      const PROXY_API = '/api/convert';  // 相对路径！
      // … 其他变量 …

      async function startConvert() {
        if (!selectedFile) return;
        // … 检查 apiKey …

        convertBtn.disabled = true;
        progressWrap.style.display = 'block';
        downloadBtn.style.display = 'none';
        errorMsg.textContent = '';
        updateProgress(10, '准备文件...');

        try {
          // 1. 将文件转为 base64
          const reader = new FileReader();
          const fileBase64 = await new Promise((resolve, reject) => {
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(selectedFile);
          });

          updateProgress(30, '正在转换...');
          
          // 2. 调用 Netlify 代理函数
          const res = await fetch(PROXY_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fileBase64,
              fileName: selectedFile.name,
              targetFormat: targetFormat
            })
          });

          const data = await res.json();
          if (!data.success) throw new Error(data.error || '转换失败');

          updateProgress(100, '转换完成！');
          convertBtn.style.display = 'none';
          downloadBtn.style.display = 'block';
          downloadBtn.dataset.url = data.downloadUrl;
        } catch (err) {
          console.error(err);
          errorMsg.textContent = '转换失败: ' + err.message;
          updateProgress(0, '');
          convertBtn.disabled = false;
        }
      }
    })();
  </script>
</body>
</html>
